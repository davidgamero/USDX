requires-python = ">=3.11,<3.12"
dependencies = [
    "demucs==4.0.1",
    "numpy>=1.26,<2",
    "soundfile>=0.13,<0.14",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "setuptools<81",
]
